<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Indigo-Purple Gradient -->
    <linearGradient id="easeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    
    <!-- Glow Accent Gradient -->
    <linearGradient id="sparkleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#easeBg)" filter="url(#shadow)" />

  <!-- Layered E Component Geometry -->
  <g filter="url(#shadow)" transform="translate(16, 8)">
    <!-- Top Horizontal Bar with Rounded Edges -->
    <rect x="136" y="136" width="208" height="48" rx="24" fill="#ffffff" />
    
    <!-- Middle Horizontal Bar -->
    <rect x="136" y="232" width="160" height="48" rx="24" fill="#ffffff" opacity="0.9" />
    
    <!-- Bottom Horizontal Bar -->
    <rect x="136" y="328" width="208" height="48" rx="24" fill="#ffffff" />

    <!-- Vertical Connecting Bar -->
    <rect x="136" y="136" width="48" height="240" rx="24" fill="#ffffff" />

    <!-- Interactive Sparkle Node (GSAP Motion Element Indicator) -->
    <path d="M 336 216 L 344 236 L 364 244 L 344 252 L 336 272 L 328 252 L 308 244 L 328 236 Z" fill="url(#sparkleGlow)" filter="url(#glow)" />
  </g>
</svg>
